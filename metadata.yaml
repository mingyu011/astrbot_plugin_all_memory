name: astrbot_plugin_all_memory
display_name: 全量记忆体
desc: 让AI拥有人一样的回忆思维，三层记忆：只追加原始层（永不删改）+ 可重算提炼层（带出处）+ 可重建索引层。注入包含系统人格、近期原文以及自建带完整信息的记忆卡。不为省钱优化，token 优先，暂不支持群聊。
short_desc: 原话永不删改；裁剪时提炼人物卡，需要时按关键词检索回来
