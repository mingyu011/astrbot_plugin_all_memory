<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>全量记忆体</title>
  <link rel="stylesheet" href="./style.css?v=0.9.13" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>全量记忆体</h1>
      <span class="sub">原始层 · 提炼层 · 检索层</span>
    </div>
    <div class="actions">
      <button id="btn-summary" class="ghost">生成纪要</button>
      <button id="btn-refine" class="ghost">提炼事实</button>
      <button id="btn-import" class="ghost">导入备份</button>
      <button id="btn-export" class="primary">一键保存全量数据</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <main class="layout">
    <aside class="panel sessions">
      <div class="panel-head">
        <div class="tabs" id="modes">
          <button data-mode="sessions" class="tab active">会话</button>
          <button data-mode="facts" class="tab">事实</button>
        </div>
        <div id="session-tools">
          <div class="tabs" id="tabs">
            <button data-kind="all" class="tab active">全部</button>
            <button data-kind="private" class="tab">私聊</button>
            <button data-kind="group" class="tab">群聊</button>
          </div>
          <input id="search" type="search" placeholder="过滤会话…" />
        </div>
        <input id="fact-search" type="search" placeholder="过滤事实…" hidden />
      </div>
      <div id="session-bar" class="list-bar">
        <label class="check-all">
          <input type="checkbox" id="select-all" />
          <span>全选</span>
        </label>
        <button id="btn-download" class="icon-btn" title="下载勾选的会话" disabled>↓</button>
      </div>
      <ul id="session-list" class="session-list"></ul>
      <ul id="fact-list" class="session-list fact-list" hidden></ul>
    </aside>

    <div class="stack">
      <section id="history-panel" class="panel history">
        <div class="panel-head">
          <div class="head-row">
            <div id="history-title" class="history-title">选择左侧一个会话</div>
            <button id="btn-session-summary" class="tiny" hidden>纪要</button>
          </div>
          <div id="history-meta" class="history-meta"></div>

          <div id="summary-box" class="summary-box" hidden>
            <div id="summary-meta" class="summary-meta"></div>
            <div id="summary-text" class="summary-text"></div>
          </div>

          <div id="usage" class="usage" hidden></div>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

      <section id="fact-panel" class="panel history" hidden>
        <div class="panel-head">
          <div id="fact-title" class="history-title">选择左侧一条事实</div>
          <div id="fact-meta" class="history-meta"></div>
        </div>
        <div id="fact-body" class="history-list fact-body">
          <div class="empty">点左侧一条事实，看它的出处和版本</div>
        </div>
      </section>
    </div>
  </main>

  <section class="settings-bar panel">
    <span class="bar-title">上下文策略</span>

    <label class="ctl">
      <span>触发裁剪</span>
      <input id="trigger" type="range" min="50" max="80" step="1" value="80" />
      <b id="trigger-val">80%</b>
    </label>

    <label class="ctl">
      <span>裁剪后总量</span>
      <input id="total" type="range" min="30" max="50" step="1" value="40" />
      <b id="total-val">40%</b>
    </label>

    <label class="ctl" title="每轮最多捞几条旧对话。实际由 5% 预算决定，装满为止">
      <span>检索条数</span>
      <input id="recall_limit" type="number" min="1" max="200" step="1" value="50" />
    </label>

    <label class="ctl" title="地图覆盖全部历史；这里设「最近多少天按天列」，更早的按月汇总">
      <span>地图细到</span>
      <input id="map_days" type="number" min="1" max="3650" step="1" value="365" />
      <span>天</span>
    </label>

    <label class="check">
      <input id="dry_run" type="checkbox" />
      <span title="只把「本来会怎么裁」写进日志，不改任何内容">演练</span>
    </label>

    <button id="btn-save" class="primary">保存</button>
    <button id="btn-reset" class="ghost"
            title="恢复默认：触发 80% / 裁到 40% / 检索 50 条 / 地图 365 天 / 关闭演练">默认</button>
    <span id="save-hint" class="hint"></span>
  </section>

  <div id="import-modal" class="modal" hidden>
    <div class="modal-box">
      <h3>从备份包恢复</h3>
      <p class="hint">
        填服务器上 zip 的完整路径（就是「一键保存」生成的那个）。<br />
        只合并、不覆盖；包里已有的条目会跳过。包里的 astrbot_data/ 不会还原。
      </p>
      <input id="import-path" type="text" placeholder="E:\backup\all_memory_20261022_194842.zip" />
      <div class="row">
        <button id="btn-import-check" class="ghost">先检查</button>
        <button id="btn-import-run" class="primary">开始恢复</button>
        <button id="btn-import-close" class="ghost">关闭</button>
      </div>
      <pre id="import-result" class="result"></pre>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="./app.js?v=0.9.13"></script>
</body>
</html>
